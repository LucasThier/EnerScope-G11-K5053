name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    # labeled/unlabeled: adding `migration-edit-ok` must re-run the migrations check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  migrations:
    name: Flyway migrations check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The check diffs the pull request against its target branch.
          fetch-depth: 0

      # Names, unique versions, no edits to migrations the base already has, and
      # timestamped names for new ones. Run it locally the same way:
      #   bash scripts/check-migrations.sh origin/master
      # (Whether the migrations actually run is checked by MigrationsOnPostgresTest,
      # in the backend job below.)
      - name: Check migration names, versions and changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # A pull request labelled `migration-edit-ok` may edit an existing migration.
          ALLOW_MIGRATION_EDITS: ${{ contains(github.event.pull_request.labels.*.name, 'migration-edit-ok') && '1' || '' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bash scripts/check-migrations.sh "origin/$BASE_REF"
          else
            bash scripts/check-migrations.sh
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          if [ -f gradlew ]; then
            echo "Detected Gradle wrapper"
            chmod +x gradlew
            ./gradlew test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Detected Gradle (no wrapper)"
            gradle test
          elif [ -f mvnw ]; then
            echo "Detected Maven wrapper"
            chmod +x mvnw
            ./mvnw --batch-mode test
          else
            echo "Detected Maven (no wrapper)"
            mvn --batch-mode test
          fi

      # MigrationsOnPostgresTest runs every migration on a real PostgreSQL and
      # validates the entities against it. It is skipped when Docker is missing,
      # which would turn this check into a silent pass.
      - name: Check that the migrations were tested on PostgreSQL
        run: |
          report=target/surefire-reports/TEST-org.enerscope.MigrationsOnPostgresTest.xml
          if [ ! -f "$report" ] || ! grep -q 'tests="1" errors="0" skipped="0" failures="0"' "$report"; then
            echo "::error::MigrationsOnPostgresTest did not run. The migrations were NOT validated against PostgreSQL."
            exit 1
          fi

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test (if a test script exists)
        run: npm test --if-present
