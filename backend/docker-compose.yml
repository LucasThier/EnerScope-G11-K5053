services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATASOURCE_DB:-enerscope}
      POSTGRES_USER: ${DATASOURCE_USERNAME:-enerscope}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-enerscope}
    ports:
      - "5432:5432"
    volumes:
      - enerscope_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME:-enerscope} -d ${DATASOURCE_DB:-enerscope}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/${DATASOURCE_DB:-enerscope}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME:-enerscope}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD:-enerscope}
    depends_on:
      db:
        condition: service_healthy

volumes:
  enerscope_pgdata:
