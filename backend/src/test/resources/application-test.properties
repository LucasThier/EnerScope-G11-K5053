# Context-load test profile: in-memory H2, no external infrastructure.
spring.datasource.url=jdbc:h2:mem:enerscope;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations are PostgreSQL-specific; let Hibernate build the H2 schema.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-secret-that-is-definitely-long-enough-256-bits-yes!!
