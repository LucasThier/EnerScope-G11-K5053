debug=false
server.port=8080
spring.mvc.servlet.path=/api/v1
spring.application.name=EnerScope

# === Logging ===
# Verbosity is controlled from the environment (.env). Valid levels:
# TRACE < DEBUG < INFO < WARN < ERROR < OFF.
#   LOG_LEVEL_ROOT -> everything (framework included)
#   LOG_LEVEL_APP  -> the application logger used by AppLogger / ConsoleAppLogger
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.EnerScope=${LOG_LEVEL_APP:INFO}

# === JWT ===
app.jwt.secret=${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-256-bits-long!!}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:60}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:30}

# === Database (PostgreSQL) ===
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/enerscope}
spring.datasource.username=${DATASOURCE_USERNAME:enerscope}
spring.datasource.password=${DATASOURCE_PASSWORD:enerscope}
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
# Schema is owned by Flyway; Hibernate only validates it against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# === Flyway (migrations) ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === Hikari Connection Pool ===
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# === CORS ===
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# === Default admin seed ===
app.admin.mail=${ADMIN_MAIL:admin@enerscope.org}
app.admin.password=${ADMIN_PASSWORD:admin12345}
app.admin.first-name=${ADMIN_FIRST_NAME:EnerScope}
app.admin.last-name=${ADMIN_LAST_NAME:Admin}

# === OpenAPI / Swagger UI ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# === App URLs ===
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.backend.base-url=${APP_BACKEND_BASE_URL:http://localhost:8080/api/v1}
